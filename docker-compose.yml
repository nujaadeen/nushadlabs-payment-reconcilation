version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: recon-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: recon_db
    volumes:
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  recon-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recon-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/recon_db
      SPRING_DATA_MONGODB_DATABASE: recon_db
      RECON_THREAD_POOL_SIZE: 4
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo_data: